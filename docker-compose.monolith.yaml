# Single-container monolith mode — all services run in one container.
# Use: docker compose -f docker-compose.monolith.yaml up
#
# All service hosts default to localhost (no cross-container env vars needed).
# The inference-app image is used but the CMD is overridden to run all services
# including training_server via supervisord-monolith.conf.
#
# Dev mode: BUILD_TARGET=dev docker compose -f docker-compose.monolith.yaml up

services:
  whiskerwatcher:
    container_name: whiskerwatcher
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-inference-app}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0' ]
              capabilities: [ gpu ]
    environment:
      THUMB_CACHE_MAX_MB: 100
      MODELS_ROOT: /app/models
    command: ["/usr/bin/supervisord", "-c", "/conf/supervisord-monolith.conf"]
    volumes:
      - ./data/:/data
      - ./conf:/conf
      - ./logs:/logs

      - ./models:/app/models
      - ./image_datasets:/app/image_datasets

      - ./apps:/app/apps
      - ./templates:/app/templates
      - ./static/images:/app/static/images
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini

      - .:/project
      - ./.vscode_container:/app/.vscode
      - ./requirements.txt:/app/requirements.txt
      - ./pyproject.toml:/app/pyproject.toml
    ports:
      - "7999:7999"  # Whisker-Watcher apps
      - "8005:8005"  # Training server
      - "8553:8554"  # RTSP relay
      - "9001:9001"  # Supervisord
    restart: unless-stopped
