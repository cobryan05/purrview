[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
# -n 8, not `auto`: this box has 16 cores and each Chromium test costs about two
# of them (browser + renderer), so effective parallelism caps at ~7.5x no matter
# how many workers start — measured flat from 8 to 32 workers (309s/308s/296s/
# 297s, see NOTES.md). The workers above 8 buy no wall time and do nothing but
# contend with the live services running on the same host. Pass `-n auto` on the
# command line to override for a run on a quiet machine.
addopts = -n 8 --dist loadfile
