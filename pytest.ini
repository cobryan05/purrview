[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
# -n 8, not `auto`. This box is an 8-core Ryzen 5700G with SMT: 8 *physical* cores
# presented as 16 threads, so "16 cores" is a thread count, not a core count, and
# 8 workers already asks for every real core. Each Chromium test costs a browser
# plus a renderer, so effective parallelism caps at ~7.5x however many workers
# start — measured flat from 8 to 32 workers (309s/308s/296s/297s, see NOTES.md).
# The workers above 8 buy no wall time and do nothing but contend with the live
# services on the same host. scripts/test.sh additionally pins the run to six of
# the eight cores; see the comment there. Pass `-n auto` on the command line to
# override for a run on a quiet machine — but note `auto` is itself not a fixed
# number (see playwright_tests/pytest.ini).
addopts = -n 8 --dist loadfile
markers =
    quarantine: known-flaky, skipped unless --run-quarantined (see FLAKY_TESTS.md)
    real_collector_fetch: opt out of the stub that resolves collector params from the params dict
