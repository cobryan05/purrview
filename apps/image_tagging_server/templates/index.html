<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Annotation Tool</title>
  <link rel="stylesheet" href="/static/css/pico.min.css" />
  <style>
    #tab-canvas toolbar {}

    #toolbar {
      display: flex;
      gap: 0.5em;
      margin-bottom: 0.5em;
      width: 100%;
    }

    #toolbar button {
      flex: 1 1 0;
      font-size: 0.95em;
      padding: 0.2em 0.7em;
      min-height: 2em;
      min-width: 0;
      border-radius: 4px;
      margin: 0;
      box-sizing: border-box;
      white-space: normal;
      line-height: 1.2;
      height: auto;
    }

    #draw-container {
      width: 100%;
      height: 80vh;
      border: 1px solid #ccc;
      overflow: hidden;
      flex-grow: 1;
      font-size: 0.95em;
    }

    #image-loader {
      margin-right: 1em;
      width: 200px;
    }

    #sidebar {
      border-left: 1px solid #ccc;
      padding-left: 1em;
      width: 20%;
      min-width: 220px;
      box-sizing: border-box;
    }

    .sidebar-container {
      display: flex;
      gap: 1em;
    }

    #main-stage {
      width: 80%;
      min-width: 0;
    }

    .primay-tab-header,
    .primary-tab-header {
      display: flex;
      border-bottom: 1px solid #ccc;
      margin-bottom: 0.5em;
    }

    .tab-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 0.2em;
      border-bottom: 1px solid #ccc;
      margin-bottom: 0.5em;
    }

    .tab-button {
      width: 100%;
      text-align: center;
      padding: 0.3em 0;
      cursor: pointer;
      border: none;
      background: none;
      font-weight: normal;
      color: #333;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s;
      box-sizing: border-box;
      font-size: 0.95em;
    }

    .tab-button:hover {
      color: #000;
    }

    .tab-button.active {
      font-weight: bold;
      border-bottom: 2px solid #ff0033;
    }

    .tab-pane {
      display: none;
    }

    .tab-pane.active {
      display: block;
    }

    .model-buttons {
      display: flex;
      gap: 0.5em;
      margin-bottom: 0.5em;
    }

    #labels-list {
      margin-bottom: 1em;
    }

    .label-row {
      display: flex;
      align-items: center;
      gap: 0.5em;
      margin-bottom: 0.3em;
      font-size: 0.95em;
    }

    .label-color {
      width: 1.2em;
      height: 1.2em;
      border-radius: 3px;
      border: 1px solid #ccc;
      display: inline-block;
    }

    .label-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .label-remove-btn {
      background: #ffdddd;
      color: #c0392b;
      border: none;
      border-radius: 3px;
      width: 2em;
      height: 2em;
      font-size: 1.2em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .label-remove-btn:hover {
      background: #ff0033;
      color: #fff;
    }

    /* Responsive: stack sidebar below main-stage on small screens */
    @media (max-width: 900px) {
      .sidebar-container {
        flex-direction: column;
      }

      #main-stage,
      #sidebar {
        width: 100%;
        min-width: 0;
      }

      #sidebar {
        border-left: none;
        border-top: 1px solid #ccc;
        padding-left: 0;
        padding-top: 1em;
      }
    }
  </style>
  <script src="/static/js/konva.min.js"></script>
</head>

<body>
  <main class="container">
    <div class="sidebar-container">
      <div id="main-stage">
        <div class="primary-tab-header">
          <span class="tab-button active" data-tab="tab-canvas">Canvas</span>
          <span class="tab-button" data-tab="tab-files">Files</span>
        </div>

        <div id="tab-canvas" class="tab-pane active">
          <nav id="toolbar">
            <button onclick="reloadImage()">Reload Image</button>
            <button data-tool="select" onclick="setTool('select')">Select</button>
            <button data-tool="rect" onclick="setTool('rect')">Rectangle</button>
            <button onclick="clearAnnotations()">Clear Annotations</button>
            <button onclick="deleteSelected()">Delete Selected</button>
            <button onclick="saveAnnotations()">Save</button>
          </nav>

          <div id="draw-container"></div>
        </div>

        <div id="tab-files" class="tab-pane">
          Files
        </div>
      </div>

      <div id="sidebar">
        <div class="tab-header">
          <span class="tab-button active" data-tab="tab-models">Models</span>
          <span class="tab-button" data-tab="tab-labels">Labels</span>
          <span class="tab-button" data-tab="tab-annotations">Annotations</span>
          <span class="tab-button" data-tab="tab-inspector">Inspector</span>
        </div>

        <div id="tab-models" class="tab-pane active">
          <div class="model-buttons">
            <button id="recognize-button">Recognize</button>
            <button id="refresh-models">Refresh Models</button>
          </div>
          <div id="model-list"></div>
        </div>

        <div id="tab-annotations" class="tab-pane">
          <button onclick="refreshAnnotations()">Refresh JSON</button>
          <pre id="annotation-json" style="max-height: 40vh; overflow-y: auto; font-size: 0.8em;"></pre>
        </div>

        <div id="tab-labels" class="tab-pane">
          <h4>Labels</h4>
          <div id="labels-list"></div>
          <form id="add-label-form" style="display: flex; align-items: center; gap: 0.5em; margin-top: 1em;">
            <input type="text" id="new-label-name" placeholder="Label name" required style="width: 8em; flex: 1;">
            <input type="color" id="new-label-color" value="#ff0033" title="Pick label color"
              style="width: 2em; height: 2em; padding: 0; border: none;">
            <button type="submit"
              style="padding: 0.2em 0.7em; font-size: 1.2em; width: 2em; height: 2em; display: flex; align-items: center; justify-content: center;">+</button>
          </form>
        </div>

        <div id="tab-inspector" class="tab-pane">
          <label>
            Label:
            <input type="text" id="labelInput" />
          </label>
          <label>
            Tags (comma-separated):
            <input type="text" id="tagsInput" />
          </label>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/app-static/js/main.js"></script>
  <script type="module" src="/app-static/js/canvas/main.js"></script>
  <script type="module" src="/app-static/js/sidebar/main.js"></script>
</body>

</html>
