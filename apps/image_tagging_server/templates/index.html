<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Annotation Tool</title>
  <link rel="stylesheet" href="/static/css/pico.min.css" />
  <style>
    body {
      margin: 0;
    }

    main.container {
      max-width: 100%;
      padding: 0.5em 1em;
      box-sizing: border-box;
    }

    .sidebar-container {
      display: flex;
      flex-direction: row;
      width: 100%;
      gap: 0;
      margin: 0;
    }

    #main-stage {
      width: 80%;
      min-width: 0;
      padding: 0;
      margin: 0;
    }

    #sidebar {
      width: 20%;
      padding: 0.5em;
      border-left: 1px solid #ccc;
      box-sizing: border-box;
    }

    .primary-tab-header {
      display: flex;
      border-bottom: 1px solid #ccc;
      margin-bottom: 0.5em;
    }

    .tab-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 0.2em;
      border-bottom: 1px solid #ccc;
      margin-bottom: 0.5em;
    }

    .tab-button {
      width: 100%;
      text-align: center;
      padding: 0.3em 0;
      cursor: pointer;
      border: none;
      background: none;
      font-weight: normal;
      color: #333;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s;
      box-sizing: border-box;
      font-size: 0.95em;
    }

    .tab-button:hover {
      color: #000;
    }

    .tab-button.active {
      font-weight: bold;
      border-bottom: 2px solid #ff0033;
    }

    .tab-pane {
      display: none;
    }

    .tab-pane.active {
      display: block;
    }

    #toolbar {
      display: flex;
      gap: 0.5em;
      margin-bottom: 0.5em;
      width: 100%;
    }

    #toolbar button {
      flex: 1 1 0;
      font-size: 0.95em;
      padding: 0.2em 0.7em;
      min-height: 2em;
      min-width: 0;
      border-radius: 4px;
      margin: 0;
      box-sizing: border-box;
      white-space: normal;
      line-height: 1.2;
      height: auto;
    }

    #toolbar button.selected {
      background-color: #ff0033;
      color: white;
      font-weight: bold;
      box-shadow: 0 0 0 2px #aa0011 inset;
    }

    #draw-container {
      width: 100%;
      height: 80vh;
      border: 1px solid #ccc;
      overflow: hidden;
      flex-grow: 1;
      font-size: 0.95em;
    }

    .model-buttons {
      display: flex;
      gap: 0.5em;
      margin-bottom: 0.5em;
    }

    #labels-list {
      margin-bottom: 1em;
    }

    .label-row {
      display: flex;
      align-items: center;
      gap: 0.5em;
      margin-bottom: 0.3em;
      font-size: 0.95em;
    }

    .label-row .selected {
      background-color: #ff0033;
      color: white;
      font-weight: bold;
      box-shadow: 0 0 0 2px #aa0011 inset;
    }


    .label-color {
      width: 1.2em;
      height: 1.2em;
      border-radius: 3px;
      border: 1px solid #ccc;
      display: inline-block;
    }

    .label-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .emoji-button {
      font-size: 0.8em;
      padding: 0.2em 0.4em;
      line-height: 1;
      vertical-align: middle;
      height: 1.8em;
    }
  </style>
  <script src="/static/js/konva.min.js"></script>
</head>

<body>
  <main class="container">
    <div class="sidebar-container">
      <div id="main-stage">
        <div class="primary-tab-header">
          <span class="tab-button active" data-tab="tab-canvas">Canvas</span>
          <span class="tab-button" data-tab="tab-files">Files</span>
          <span class="tab-button" data-tab="tab-labels">Edit Labels</span>
        </div>

        <div id="tab-canvas" class="tab-pane active">
          <nav id="toolbar">
            <button onclick="reloadImage()">Reload Image</button>
            <button data-tool="select" onclick="setTool('select')">Select</button>
            <button data-tool="bbox" onclick="setTool('bbox')">BBox</button>
            <button onclick="clearAnnotations()">Clear Annotations</button>
            <button onclick="deleteSelected()">Delete Selected</button>
            <button onclick="saveAnnotations()">Save</button>
          </nav>
          <div id="draw-container"></div>
        </div>

        <div id="tab-files" class="tab-pane">Files</div>

        <div id="tab-labels" class="tab-pane">
          <div style="display: flex; gap: 1em; align-items: flex-start; flex-wrap: wrap;">
            <!-- Left side: Label management -->
            <div style="flex: 1 1 300px; min-width: 250px;">
              <h4>Labels</h4>
              <div id="labels-list"></div>
            </div>
            <!-- Right side: Preset groups placeholder -->
            <div style="flex: 1 1 300px; min-width: 250px;">
              <h4>Presets</h4>
              <div id="presets-placeholder"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="sidebar">
        <div class="tab-header">
          <span class="tab-button active" data-tab="tab-models">Models</span>
          <span class="tab-button" data-tab="tab-labels-tool">Labels</span>
          <span class="tab-button" data-tab="tab-annotations">Annotations</span>
          <span class="tab-button" data-tab="tab-inspector">Inspector</span>
        </div>

        <div id="tab-models" class="tab-pane active">
          <div class="model-buttons">
            <button id="recognize-button">Recognize</button>
            <button id="refresh-models">Refresh Models</button>
          </div>
          <div id="model-list"></div>
        </div>

        <div id="tab-annotations" class="tab-pane">
          <button onclick="refreshAnnotations()">Refresh JSON</button>
          <pre id="annotation-json" style="max-height: 40vh; overflow-y: auto; font-size: 0.8em;"></pre>
        </div>

        <div id="tab-labels-tool" class="tab-pane">
          <h4>Labels</h4>
          <div id="labels-tool-list"></div>
        </div>

        <div id="tab-inspector" class="tab-pane">
          <label>
            Label:
            <input type="text" id="labelInput" />
          </label>
          <label>
            Tags (comma-separated):
            <input type="text" id="tagsInput" />
          </label>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/app-static/js/main.js"></script>
  <script type="module" src="/app-static/js/canvas/main.js"></script>
  <script type="module" src="/app-static/js/sidebar/main.js"></script>
</body>

</html>
