<!DOCTYPE html>
<!-- Deliberately self-contained: no <link>/<script> to /static or /app-static.
     Both are gated by AuthGate the same as everything else, and this page is the
     one thing that has to render correctly *before* a cookie exists — pulling in
     an external stylesheet here would make the login form itself unstyled on a
     fresh, auth-required install. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PurrView — Sign in</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14181c;
      color: #e4e6eb;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    form {
      width: 22rem;
      max-width: calc(100vw - 3rem);
      padding: 2rem;
      border: 1px solid #2a2f36;
      border-radius: 0.5rem;
      background: #1b2025;
    }
    h1 { font-size: 1.25rem; margin: 0 0 1.25rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.35rem; color: #a6adba; }
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 0.55rem 0.65rem;
      border-radius: 0.35rem;
      border: 1px solid #3a4048;
      background: #10141a;
      color: inherit;
      font-size: 1rem;
    }
    button {
      margin-top: 1.1rem;
      width: 100%;
      padding: 0.6rem;
      border: none;
      border-radius: 0.35rem;
      background: #3b82f6;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #2f6fd6; }
    .error {
      margin: 0 0 1rem;
      padding: 0.55rem 0.7rem;
      border-radius: 0.35rem;
      background: #3a1f22;
      color: #f3a9ac;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>PurrView</h1>
    {% if error %}<p class="error">{% if password_mode %}Wrong password{% else %}Wrong token{% endif %} — try again.</p>{% endif %}
    <label for="token">{% if password_mode %}Password{% else %}Access token{% endif %}</label>
    <input type="password" id="token" name="token" autofocus required autocomplete="current-password" />
    <input type="hidden" name="next" value="{{ next }}" />
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
