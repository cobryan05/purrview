<div>
    {% for image in images %}
      <img src="{{ image }}" alt="Image" style="max-width: 200px; margin: 5px;">
    {% endfor %}
  </div>

  <div>
    {% if page > 1 %}
      <button hx-get="/list-images?page={{ page - 1 }}" hx-target="#image-container">Previous</button>
    {% endif %}

    {% if page < total_pages %}
      <button hx-get="/list-images?page={{ page + 1 }}" hx-target="#image-container">Next</button>
    {% endif %}
  </div>
