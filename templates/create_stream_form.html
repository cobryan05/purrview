<h1>Create a New Stream</h1>

<form hx-post="/create-stream" hx-target="#output-div" hx-swap="innerHTML">
    <label for="source_url">Source URL:</label><br>
    <input type="text" id="source_url" name="source_url" required><br><br>

    <label for="destination_name">Destination Name:</label><br>
    <input type="text" id="destination_name" name="destination_name" required><br><br>

    <label for="delay">Delay (seconds):</label><br>
    <input type="number" id="delay" name="delay" min="0" step="1" value="0"><br><br>

    <button type="submit">Create Stream</button>
</form>
