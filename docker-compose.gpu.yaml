# GPU inference overlay for CPU-buildable services (`app`, `app-dev`).
#
# Merge this alongside the base file to grant the frontend+inference
# container access to the GPU, so onnxruntime-gpu uses the CUDA execution
# provider:
#
#   COMPOSE_FILE=docker-compose.yaml:docker-compose.gpu.yaml
#
# Only meaningful when the service is built for GPU inference, i.e.:
#   APP_BASE=cuda-runtime  ORT_REQUIREMENTS=requirements-gpu.txt
#
# Do NOT merge this on a CPU-only host — reserving an nvidia device there
# prevents the container from starting. (setup.sh wires this automatically.)
#
# Which GPUs the container may use is GPU_DEVICES, and how Docker attaches them
# is GPU_DRIVER / GPU_DEVICE_ID (both see docker-compose.yaml); this overlay only
# grants access to the hardware.
#
# training/mono/training-dev/mono-dev always need a GPU (training), so they
# reserve one unconditionally in the base file and never need this overlay.
services:
  app:
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${GPU_DRIVER:-nvidia}
              device_ids: ['${GPU_DEVICE_ID:-all}']
              capabilities: [gpu]
  app-dev:
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${GPU_DRIVER:-nvidia}
              device_ids: ['${GPU_DEVICE_ID:-all}']
              capabilities: [gpu]
