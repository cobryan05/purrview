# =====================================================================
# PurrView — deployment topologies via compose profiles + .env
# =====================================================================
# One static set of services; a deployment is selected by COMPOSE_PROFILES
# and parameterized by .env. Run ./setup.sh to generate a .env, or copy
# .env.example and edit. With no .env, defaults give the slim CPU stack.
#
# Profiles (COMPOSE_PROFILES):
#   app                 frontend + inference group in one container
#   training            standalone training node (GPU)
#   app,training        "split": frontend group + a local training container
#   mono                everything in one container (GPU)
#   dev                 app-dev + training-dev workspaces
#   dev-mono            single-container dev workspace (everything)
#
# Build/runtime knobs (.env):
#   APP_BASE            slim-runtime (CPU, default) | cuda-runtime (GPU inference)
#   ORT_REQUIREMENTS    requirements-cpu.txt (default) | requirements-gpu.txt
#   TRAINING_SERVER_HOST  hostname the frontend uses to reach training
#                         (defaults to the `training` compose service)
#   COMPOSE_FILE        add :docker-compose.gpu.yaml to give `app` a GPU
#                       (needed for onnxruntime-gpu inference)
#
# ---------------------------------------------------------------------
# !! RECORDING STORAGE — read before changing where recordings are kept !!
#
# NVR clips, event snapshots and event timelapses live under /data/recordings/,
# i.e. inside the `./data/:/data` bind mount below. To move recordings to
# another disk, move that WHOLE mount (e.g. `- /mnt/nas/ww:/data`). Everything
# beneath it belongs to the app, so that is always safe.
#
# Do NOT bind-mount a directory that holds anything else at an individual
# recordings root. The retention sweep deletes a recording's own file via its
# database row (safe — only ever files we created), but the ORPHAN sweep walks
# those roots and deletes every unreferenced file older than
# RECORDINGS_ORPHAN_GRACE_S (default 900 s), with no extension filter and no way
# to tell your files from ours. Point it at a shared media folder and it empties
# it. See .env.example for the full explanation.
# ---------------------------------------------------------------------
# =====================================================================

# Which GPUs a container may use is `GPU_DEVICES` (a CUDA_VISIBLE_DEVICES list,
# e.g. "0" or "0,1"), not this reservation. Compose interpolates into scalars
# only, so `device_ids` cannot be driven by one env var — the reservation
# therefore grants every GPU the host has and GPU_DEVICES narrows it per
# service. Reservations are not exclusive, so granting all of them takes nothing
# away from other containers.
#
# GPU_DEVICES must never be set to the empty string: unset means "all GPUs" to
# CUDA, but empty means "no GPUs", and that reads as a container that silently
# lost its GPU. setup.sh always writes an explicit index list.
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-gpu-env: &gpu-env
  CUDA_VISIBLE_DEVICES: ${GPU_DEVICES:-0}
  # Which of the exposed cards each service uses by default, as a CUDA ordinal —
  # a position within GPU_DEVICES, NOT a physical card id (CUDA_VISIBLE_DEVICES
  # renumbers from zero). setup.sh asks in physical ids and writes ordinals.
  #
  # Empty means "let onnxruntime/torch choose", which is the behaviour these
  # services had before the setting existed. A model's own sidecar `device`
  # (auto/gpu/cpu/gpu:<n>) still overrides INFERENCE_GPU, and a training job's
  # own `gpu_device` still overrides TRAINING_GPU.
  INFERENCE_GPU: ${INFERENCE_GPU:-}
  TRAINING_GPU: ${TRAINING_GPU:-}

x-build-args: &build-args
  APP_BASE: ${APP_BASE:-slim-runtime}
  ORT_REQUIREMENTS: ${ORT_REQUIREMENTS:-requirements-cpu.txt}
  APPUSER_UID: ${APPUSER_UID:-1000}
  APPUSER_GID: ${APPUSER_GID:-1000}

# Container-stdout cap. Almost nothing reaches the container log — supervisord
# redirects every service to its own rotated file under ./logs — but the
# json-file driver defaults to unbounded, so a crash loop printing to stdout
# before supervisord takes over has no ceiling at all.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  # -------------------------------------------------------------------
  # App: frontend + inference group (image_tagging / inference / tasks /
  # db / relay / mediamtx) in one container. CPU by default; build with
  # APP_BASE=cuda-runtime + ORT_REQUIREMENTS=requirements-gpu.txt and merge
  # docker-compose.gpu.yaml for GPU inference.
  # -------------------------------------------------------------------
  app:
    logging: *logging
    container_name: purrview_app
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args: *build-args
    environment:
      <<: *gpu-env
      THUMB_CACHE_MAX_MB: ${THUMB_CACHE_MAX_MB:-100}
      # Corrects a timing offset between a recorded clip and its overlaid
      # detection boxes: the clip is cut on the relay's record clock while
      # boxes are stamped on the watcher's fetch clock, and the two drift
      # apart. Shifts boxes EARLIER by this many seconds; negative shifts
      # them later. Default 0 = no correction. Tune by eye against a clip:
      # boxes behind the subject -> raise it; boxes ahead of it -> go negative.
      WATCH_OVERLAY_LAG_S: ${WATCH_OVERLAY_LAG_S:-0}
      STREAM_BUFFER_SIZE: ${STREAM_BUFFER_SIZE:-512m}
      MODELS_ROOT: /app/models
      # Reach the training node; defaults to the `training` compose service.
      # Point at a remote host for a remote training box.
      TRAINING_SERVER_HOST: ${TRAINING_SERVER_HOST:-training}
      # The port the frontend dials, not the one this host publishes: a local
      # `training` service is always reached on its container port 8005, so
      # only a remote trainer behind a custom port needs this changed.
      TRAINING_SERVER_PORT: ${TRAINING_SERVER_PORT:-8005}
    # `training` is only part of the compose project when its own profile is
    # active (e.g. the "app,training" split); `required: false` lets `app`
    # start on its own for the "frontend + remote training" topology while
    # still sequencing after `training` when both are enabled together.
    depends_on:
      training:
        condition: service_started
        required: false
    volumes:
      # Local time comes from the host, not from a hardcoded zone: every
      # service reads the host's /etc/localtime + /etc/timezone read-only, so
      # log timestamps and event times match the machine the stack runs on.
      # Set TZ in .env only to deliberately override the host.
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Recordings live at /data/recordings/. Relocate by moving THIS mount, not
      # by mounting something at a recordings root — see the note in the header.
      - ./data/:/data
      - ./conf:/conf
      - ./logs:/logs
      - ./models:/app/models
      - ./image_datasets:/app/image_datasets
    # In-RAM rolling buffer for MediaMTX recordings (the NVR rewind window).
    # A cap, not an allocation: an empty /buffer costs ~0 RAM. ~30 MB per
    # camera per 60 s at 4 Mbps, so 512m holds ~17 camera-minutes. Deliberately
    # NOT /dev/shm (64 MB on `app`, DataLoader-shared on `mono`).
    tmpfs:
      - /buffer:size=${STREAM_BUFFER_SIZE:-512m},mode=1777
    ports:
      - "${APP_PORT:-7999}:7999"   # PurrView main app
      - "${RTSP_PORT:-8553}:8554"   # RTSP relay
      - "${SUPERVISORD_PORT:-9001}:9001"   # Supervisord
    restart: unless-stopped
    profiles: ["app"]

  # -------------------------------------------------------------------
  # Training: standalone ML node (GPU). Talks to the frontend only over
  # HTTP, so it can live on a separate/remote GPU host.
  # -------------------------------------------------------------------
  training:
    logging: *logging
    container_name: purrview_training
    shm_size: ${TRAINING_SHM_SIZE:-2gb}
    <<: *gpu
    build:
      context: .
      dockerfile: Dockerfile
      target: training-app
      args: *build-args
    environment:
      <<: *gpu-env
      TRAINING_CACHE_DIR: /training-cache
      TRAINING_CACHE_MAX_MB: ${TRAINING_CACHE_MAX_MB:-10000}
      # 1 when this deployment was set up expecting a training GPU, 0 when the
      # operator knowingly accepted CPU training. Unset means "unknown", which
      # the training server treats as expecting one.
      TRAINING_EXPECTS_GPU: ${TRAINING_EXPECTS_GPU:-1}
      TRAINING_CACHE_MAX_AGE_DAYS: ${TRAINING_CACHE_MAX_AGE_DAYS:-30}
      TRAINING_CACHE_SWEEP_INTERVAL_SEC: ${TRAINING_CACHE_SWEEP_INTERVAL_SEC:-3600}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./conf:/conf
      - ./logs:/logs
      - training_cache:/training-cache
    ports:
      - "${TRAINING_PORT:-8005}:8005"   # Training API server
      - "${TRAINING_SUPERVISORD_PORT:-9002}:9001"   # Supervisord dashboard
    restart: unless-stopped
    profiles: ["training"]

  # -------------------------------------------------------------------
  # Mono: everything in one PRODUCTION container (GPU). Build with
  # APP_BASE=cuda-runtime + ORT_REQUIREMENTS=requirements-gpu.txt.
  # -------------------------------------------------------------------
  mono:
    logging: *logging
    container_name: purrview_mono
    shm_size: ${TRAINING_SHM_SIZE:-2gb}
    <<: *gpu
    build:
      context: .
      dockerfile: Dockerfile
      target: combined
      args: *build-args
    environment:
      <<: *gpu-env
      THUMB_CACHE_MAX_MB: ${THUMB_CACHE_MAX_MB:-100}
      # Corrects a timing offset between a recorded clip and its overlaid
      # detection boxes: the clip is cut on the relay's record clock while
      # boxes are stamped on the watcher's fetch clock, and the two drift
      # apart. Shifts boxes EARLIER by this many seconds; negative shifts
      # them later. Default 0 = no correction. Tune by eye against a clip:
      # boxes behind the subject -> raise it; boxes ahead of it -> go negative.
      WATCH_OVERLAY_LAG_S: ${WATCH_OVERLAY_LAG_S:-0}
      STREAM_BUFFER_SIZE: ${STREAM_BUFFER_SIZE:-512m}
      MODELS_ROOT: /app/models
      TRAINING_SERVER_HOST: localhost
      DB_SERVER_HOST: localhost
      TRAINING_CACHE_DIR: /training-cache
      TRAINING_CACHE_MAX_MB: ${TRAINING_CACHE_MAX_MB:-10000}
      # 1 when this deployment was set up expecting a training GPU, 0 when the
      # operator knowingly accepted CPU training. Unset means "unknown", which
      # the training server treats as expecting one.
      TRAINING_EXPECTS_GPU: ${TRAINING_EXPECTS_GPU:-1}
      TRAINING_CACHE_MAX_AGE_DAYS: ${TRAINING_CACHE_MAX_AGE_DAYS:-30}
      TRAINING_CACHE_SWEEP_INTERVAL_SEC: ${TRAINING_CACHE_SWEEP_INTERVAL_SEC:-3600}
    command: ["/usr/bin/supervisord", "-c", "/conf/supervisord-monolith.conf"]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Recordings live at /data/recordings/. Relocate by moving THIS mount, not
      # by mounting something at a recordings root — see the note in the header.
      - ./data/:/data
      - ./conf:/conf
      - ./logs:/logs
      - ./models:/app/models
      - ./image_datasets:/app/image_datasets
      - training_cache:/training-cache
    # In-RAM rolling buffer for MediaMTX recordings (the NVR rewind window).
    # A cap, not an allocation: an empty /buffer costs ~0 RAM. ~30 MB per
    # camera per 60 s at 4 Mbps, so 512m holds ~17 camera-minutes. Deliberately
    # NOT /dev/shm (64 MB on `app`, DataLoader-shared on `mono`).
    tmpfs:
      - /buffer:size=${STREAM_BUFFER_SIZE:-512m},mode=1777
    ports:
      - "${APP_PORT:-7999}:7999"   # PurrView main app
      - "${TRAINING_PORT:-8005}:8005"   # Training server
      - "${RTSP_PORT:-8553}:8554"   # RTSP relay
      - "${SUPERVISORD_PORT:-9001}:9001"   # Supervisord
    restart: unless-stopped
    profiles: ["mono"]

  # -------------------------------------------------------------------
  # Dev workspaces (source-mounted, dev tooling). training-dev/mono-dev
  # always need a GPU (training); app-dev's GPU is opt-in via the overlay,
  # same as the prod `app` service, since it can be built CPU-only.
  # -------------------------------------------------------------------
  app-dev:
    logging: *logging
    container_name: purrview_app_dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args: *build-args
    environment:
      <<: *gpu-env
      THUMB_CACHE_MAX_MB: ${THUMB_CACHE_MAX_MB:-100}
      # Corrects a timing offset between a recorded clip and its overlaid
      # detection boxes: the clip is cut on the relay's record clock while
      # boxes are stamped on the watcher's fetch clock, and the two drift
      # apart. Shifts boxes EARLIER by this many seconds; negative shifts
      # them later. Default 0 = no correction. Tune by eye against a clip:
      # boxes behind the subject -> raise it; boxes ahead of it -> go negative.
      WATCH_OVERLAY_LAG_S: ${WATCH_OVERLAY_LAG_S:-0}
      STREAM_BUFFER_SIZE: ${STREAM_BUFFER_SIZE:-512m}
      MODELS_ROOT: /app/models
      TRAINING_SERVER_HOST: ${TRAINING_SERVER_HOST:-training-dev}
      TRAINING_SERVER_PORT: ${TRAINING_SERVER_PORT:-8005}
    # training-dev is always part of the same "dev" profile as app-dev, so
    # this can be an unconditional dependency (unlike app -> training).
    depends_on:
      - training-dev
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Recordings live at /data/recordings/. Relocate by moving THIS mount, not
      # by mounting something at a recordings root — see the note in the header.
      - ./data/:/data
      - ./conf:/conf
      - ./logs:/logs
      - ./models:/app/models
      - ./image_datasets:/app/image_datasets
      - ./apps:/app/apps
      - ./templates:/app/templates
      - ./static/images:/app/static/images
      - .:/project
      - ./.vscode:/app/.vscode
    # In-RAM rolling buffer for MediaMTX recordings (the NVR rewind window).
    # A cap, not an allocation: an empty /buffer costs ~0 RAM. ~30 MB per
    # camera per 60 s at 4 Mbps, so 512m holds ~17 camera-minutes. Deliberately
    # NOT /dev/shm (64 MB on `app`, DataLoader-shared on `mono`).
    tmpfs:
      - /buffer:size=${STREAM_BUFFER_SIZE:-512m},mode=1777
    ports:
      - "${APP_PORT:-7999}:7999"
      - "${RTSP_PORT:-8553}:8554"
      - "${SUPERVISORD_PORT:-9001}:9001"
    restart: "no"
    profiles: ["dev"]

  training-dev:
    logging: *logging
    container_name: purrview_training_dev
    shm_size: ${TRAINING_SHM_SIZE:-2gb}
    <<: *gpu
    build:
      context: .
      dockerfile: Dockerfile
      target: training-dev
      args: *build-args
    environment:
      <<: *gpu-env
      TRAINING_CACHE_DIR: /training-cache
      TRAINING_CACHE_MAX_MB: ${TRAINING_CACHE_MAX_MB:-10000}
      # 1 when this deployment was set up expecting a training GPU, 0 when the
      # operator knowingly accepted CPU training. Unset means "unknown", which
      # the training server treats as expecting one.
      TRAINING_EXPECTS_GPU: ${TRAINING_EXPECTS_GPU:-1}
      TRAINING_CACHE_MAX_AGE_DAYS: ${TRAINING_CACHE_MAX_AGE_DAYS:-30}
      TRAINING_CACHE_SWEEP_INTERVAL_SEC: ${TRAINING_CACHE_SWEEP_INTERVAL_SEC:-3600}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./conf:/conf
      - ./logs:/logs
      - ./apps:/app/apps
      - .:/project
      - training_cache:/training-cache
    ports:
      - "${TRAINING_PORT:-8005}:8005"
      - "${TRAINING_SUPERVISORD_PORT:-9002}:9001"
    restart: "no"
    profiles: ["dev"]

  mono-dev:
    logging: *logging
    container_name: purrview_mono_dev
    shm_size: ${TRAINING_SHM_SIZE:-2gb}
    # No per-container memory limit: this workspace runs training (torch +
    # DataLoader workers) alongside the app and a full browser test suite, so
    # a fixed ceiling is hard to size without killing legitimate jobs. Memory
    # safety here relies on host-level OOM handling instead of a cgroup cap.
    #
    # Docker's default open-file soft limit (1024) is easy to exhaust in this
    # workspace: every DataLoader worker holds descriptors on top of the app,
    # the collectors, and the browser test suite. Trainers reap their own
    # workers; this just raises the ceiling so that cleanup has room to work.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    <<: *gpu
    build:
      context: .
      dockerfile: Dockerfile
      target: combined-dev
      args: *build-args
    environment:
      <<: *gpu-env
      THUMB_CACHE_MAX_MB: ${THUMB_CACHE_MAX_MB:-100}
      # Corrects a timing offset between a recorded clip and its overlaid
      # detection boxes: the clip is cut on the relay's record clock while
      # boxes are stamped on the watcher's fetch clock, and the two drift
      # apart. Shifts boxes EARLIER by this many seconds; negative shifts
      # them later. Default 0 = no correction. Tune by eye against a clip:
      # boxes behind the subject -> raise it; boxes ahead of it -> go negative.
      WATCH_OVERLAY_LAG_S: ${WATCH_OVERLAY_LAG_S:-0}
      STREAM_BUFFER_SIZE: ${STREAM_BUFFER_SIZE:-512m}
      TRAINING_SERVER_HOST: localhost
      DB_SERVER_HOST: localhost
      TRAINING_CACHE_DIR: /training-cache
      TRAINING_CACHE_MAX_MB: ${TRAINING_CACHE_MAX_MB:-10000}
      # 1 when this deployment was set up expecting a training GPU, 0 when the
      # operator knowingly accepted CPU training. Unset means "unknown", which
      # the training server treats as expecting one.
      TRAINING_EXPECTS_GPU: ${TRAINING_EXPECTS_GPU:-1}
      TRAINING_CACHE_MAX_AGE_DAYS: ${TRAINING_CACHE_MAX_AGE_DAYS:-30}
      TRAINING_CACHE_SWEEP_INTERVAL_SEC: ${TRAINING_CACHE_SWEEP_INTERVAL_SEC:-3600}
      MODELS_ROOT: /app/models
    command: ["/usr/bin/supervisord", "-c", "/conf/supervisord-monolith.conf"]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Recordings live at /data/recordings/. Relocate by moving THIS mount, not
      # by mounting something at a recordings root — see the note in the header.
      - ./data/:/data
      - ./conf:/conf
      - ./logs:/logs
      - ./models:/app/models
      - ./image_datasets:/app/image_datasets
      - ./apps:/app/apps
      - ./templates:/app/templates
      - ./static/images:/app/static/images
      - .:/project
      - ./.vscode:/app/.vscode
      - training_cache:/training-cache
    # In-RAM rolling buffer for MediaMTX recordings (the NVR rewind window).
    # A cap, not an allocation: an empty /buffer costs ~0 RAM. ~30 MB per
    # camera per 60 s at 4 Mbps, so 512m holds ~17 camera-minutes. Deliberately
    # NOT /dev/shm (64 MB on `app`, DataLoader-shared on `mono`).
    tmpfs:
      - /buffer:size=${STREAM_BUFFER_SIZE:-512m},mode=1777
    ports:
      - "${APP_PORT:-7999}:7999"
      - "${TRAINING_PORT:-8005}:8005"
      - "${RTSP_PORT:-8553}:8554"
      - "${SUPERVISORD_PORT:-9001}:9001"
    restart: "no"
    profiles: ["dev-mono"]

volumes:
  training_cache:
