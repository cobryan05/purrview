services:
  # =========================================================
  #  Inference / Main Web Server (Production Profile)
  # =========================================================
  whiskerwatcher:
    container_name: whiskerwatcher
    build:
      context: .
      dockerfile: Dockerfile
      target: inference-app
      args:
        - APPUSER_UID=${APPUSER_UID:-1001}
        - APPUSER_GID=${APPUSER_GID:-1001}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0' ]
              capabilities: [ gpu ]
    environment:
      THUMB_CACHE_MAX_MB: 100
      TRAINING_SERVER_HOST: whiskerwatcher_training
    volumes:
      - ./data/:/data
      - ./conf:/conf
      - ./logs:/logs
    ports:
      - "7999:7999"  # Whisker-Watcher main app
      - "8553:8554"  # RTSP relay
      - "9001:9001"  # Supervisord
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      - whiskerwatcher_training

  # =========================================================
  #  Training Server (Production Profile)
  # =========================================================
  whiskerwatcher_training:
    container_name: whiskerwatcher_training
    shm_size: '2gb'
    build:
      context: .
      dockerfile: Dockerfile
      target: training-app
      args:
        - APPUSER_UID=${APPUSER_UID:-1001}
        - APPUSER_GID=${APPUSER_GID:-1001}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0' ]
              capabilities: [ gpu ]
    environment:
      TRAINING_CACHE_DIR: /training-cache
      TRAINING_CACHE_MAX_MB: 10000
    volumes:
      - ./conf:/conf
      - ./logs:/logs
      - training_cache:/training-cache
    ports:
      - "8005:8005"   # Training API server
      - "9002:9001"   # Supervisord dashboard
    restart: unless-stopped
    profiles: ["prod"]

  # =========================================================
  #  Inference Core Workspace (Development Profile)
  # =========================================================
  whiskerwatcher-dev:
    container_name: whiskerwatcher_dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        - APPUSER_UID=${APPUSER_UID:-1001}
        - APPUSER_GID=${APPUSER_GID:-1001}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0' ]
              capabilities: [ gpu ]
    environment:
      THUMB_CACHE_MAX_MB: 100
      TRAINING_SERVER_HOST: whiskerwatcher_training_dev
      MODELS_ROOT: /app/models
      TZ: America/Chicago
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./data/:/data
      - ./conf:/conf
      - ./logs:/logs
      - ./models:/app/models
      - ./image_datasets:/app/image_datasets
      - ./apps:/app/apps
      - ./templates:/app/templates
      - ./static/images:/app/static/images
      - .:/project
      - ./.vscode:/app/.vscode
    ports:
      - "7999:7999"
      - "8553:8554"
      - "9001:9001"
    restart: "no"
    profiles: ["dev"]
    depends_on:
      - whiskerwatcher-training-dev

  # =========================================================
  #  Training Pipeline Workspace (Development Profile)
  # =========================================================
  whiskerwatcher-training-dev:
    container_name: whiskerwatcher_training_dev
    shm_size: '2gb'
    build:
      context: .
      dockerfile: Dockerfile
      target: training-dev
      args:
        - APPUSER_UID=${APPUSER_UID:-1001}
        - APPUSER_GID=${APPUSER_GID:-1001}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0' ]
              capabilities: [ gpu ]
    environment:
      TRAINING_CACHE_DIR: /training-cache
      TRAINING_CACHE_MAX_MB: 10000
    volumes:
      - ./conf:/conf
      - ./logs:/logs
      - ./apps:/app/apps
      - .:/project
      - training_cache:/training-cache
    ports:
      - "8005:8005"
      - "9002:9001"
    restart: "no"
    profiles: ["dev"]

  # =========================================================
  #  Combined Dev Workspace (inference + training, one container)
  #  Dev sibling of the `combined` profile below: everything in one
  #  container plus dev tooling. Use ./rebuild.sh dev-combined.
  # =========================================================
  whiskerwatcher-combined-dev:
    container_name: whiskerwatcher_combined_dev
    shm_size: '2gb'
    build:
      context: .
      dockerfile: Dockerfile
      target: combined-dev
      args:
        - APPUSER_UID=${APPUSER_UID:-1001}
        - APPUSER_GID=${APPUSER_GID:-1001}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0' ]
              capabilities: [ gpu ]
    environment:
      THUMB_CACHE_MAX_MB: 100
      TRAINING_SERVER_HOST: localhost
      DB_SERVER_HOST: localhost
      TRAINING_CACHE_DIR: /training-cache
      TRAINING_CACHE_MAX_MB: 10000
      MODELS_ROOT: /app/models
      TZ: America/Chicago
    command: ["/usr/bin/supervisord", "-c", "/conf/supervisord-monolith.conf"]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./data/:/data
      - ./conf:/conf
      - ./logs:/logs
      - ./models:/app/models
      - ./image_datasets:/app/image_datasets
      - ./apps:/app/apps
      - ./templates:/app/templates
      - ./static/images:/app/static/images
      - .:/project
      - ./.vscode:/app/.vscode
      - training_cache:/training-cache
    ports:
      - "7999:7999"
      - "8005:8005"
      - "8553:8554"
      - "9001:9001"
    restart: "no"
    profiles: ["dev-combined"]

  # =========================================================
  #  Combined Server (inference + training in one PRODUCTION container)
  #  Single-container deployment: every service runs under
  #  supervisord-monolith.conf in the lean `combined` image (no dev
  #  tooling). All inter-service hosts are localhost. Use ./rebuild.sh combined.
  # =========================================================
  whiskerwatcher-combined:
    container_name: whiskerwatcher_combined
    shm_size: '2gb'
    build:
      context: .
      dockerfile: Dockerfile
      target: combined
      args:
        - APPUSER_UID=${APPUSER_UID:-1001}
        - APPUSER_GID=${APPUSER_GID:-1001}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0' ]
              capabilities: [ gpu ]
    environment:
      THUMB_CACHE_MAX_MB: 100
      TRAINING_SERVER_HOST: localhost
      DB_SERVER_HOST: localhost
      TRAINING_CACHE_DIR: /training-cache
      TRAINING_CACHE_MAX_MB: 10000
      MODELS_ROOT: /app/models
    command: ["/usr/bin/supervisord", "-c", "/conf/supervisord-monolith.conf"]
    volumes:
      - ./data/:/data
      - ./conf:/conf
      - ./logs:/logs
      - ./models:/app/models
      - ./image_datasets:/app/image_datasets
      - training_cache:/training-cache
    ports:
      - "7999:7999"  # Whisker-Watcher main app
      - "8005:8005"  # Training server
      - "8553:8554"  # RTSP relay
      - "9001:9001"  # Supervisord
    restart: unless-stopped
    profiles: ["combined"]

volumes:
  training_cache: