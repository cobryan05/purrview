name: Feature request
description: Something the app should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The job you are stuck on, not the feature you have in mind for it.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The workaround, the manual step, or why there is not one.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you think would fix it
      description: Optional — the problem above matters more.
