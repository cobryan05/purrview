[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=appuser
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; A unix socket, deliberately not a second TCP listener: supervisorctl needs *some*
; server to talk to, and process control (start/stop/restart any service) is not
; something to put on the network. The socket lives in /tmp because supervisord runs as
; `appuser` while /var/run is root-owned — the previous serverurl pointed at a socket
; nothing was able to create, which is why every supervisorctl call died with
; "unix:///var/run/supervisor.sock no such file".
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[inet_http_server]
port=0.0.0.0:9001
;username=admin        ; optional
;password=secret       ; optional

; Without this, supervisord serves the read-only dashboard but implements none of the
; control API, so supervisorctl fails with "did not recognize the supervisor namespace
; commands" even once it can reach the server. Both halves are required; adding the
; socket alone does not fix it.
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock


[program:image_tagging_server]
command=uvicorn apps.image_tagging_server.main:app --host 0.0.0.0 --port 7999
directory=/app
autostart=true
autorestart=true
stdout_logfile=/logs/image_tagging_server_stdout.log
stderr_logfile=/logs/image_tagging_server_stderr.log
stdout_logfile_maxbytes=4194304
stderr_logfile_maxbytes=4194304

