[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=appuser
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[inet_http_server]
port=0.0.0.0:9001
;username=admin        ; optional
;password=secret       ; optional

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock


[program:training_server]
command=uvicorn apps.training_server.main:app --host 0.0.0.0 --port 8005
directory=/app
autostart=true
autorestart=true
stdout_logfile=/logs/training_server_stdout.log
stderr_logfile=/logs/training_server_stderr.log
stdout_logfile_maxbytes=4194304
stderr_logfile_maxbytes=4194304
