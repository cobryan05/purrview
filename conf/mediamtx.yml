api: yes
apiAddress: :9997
rtspAddress: :8554
logLevel: info
protocols: [tcp]

# Playback server. Recording itself is enabled per-path at runtime by
# stream_server (record / recordPath / recordDeleteAfter), which points
# each watched camera at the in-RAM /buffer tmpfs. This server is what turns
# those segments into retroactive clips: /list reports the buffered time ranges
# and /get concatenates an arbitrary window into a single mp4, which is how an
# event gets pre-roll chosen *after* the fact.
playback: yes
playbackAddress: :9996

authInternalUsers:
- user: any
  pass:
  ips: []
  permissions:
  - action: api
  - action: read
  - action: publish
  - action: playback
