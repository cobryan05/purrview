[pytest]
testpaths = .
pythonpath = ..
; loadscope (per-class) rather than loadfile. This is insurance, not a speedup:
; measured back-to-back it is a wash (336s/314s vs loadfile's 339s/313s),
; because this host is CPU-saturated by its own co-resident services and
; scheduling granularity is not what binds. What it removes is a *floor*:
; under loadfile every test in a file runs on one worker, so
; test_configuration_watchers.py (305s of the suite's 2304s of work) meant the
; run could never finish faster than 305s however many workers were idle.
; Per-class buckets bring the largest indivisible unit to ~40s, so the suite
; can actually get faster if the box is ever quiet or gains cores.
;
; -n 8 explicitly, never `auto`. `auto` is not a fixed number: xdist resolves it from
; psutil's *physical* core count when psutil is installed (8 here, an 8-core Ryzen with
; SMT) and falls back to the logical count or the affinity mask when it is not — so the
; same `auto` means 8, 12 or 16 workers depending on what is in site-packages and whether
; the run is CPU-pinned. On this box 16 workers on 8 cores is what takes the live app
; down, so the count is pinned rather than inferred.
;
; 8 workers over the 6 cores scripts/test.sh pins to is deliberate oversubscription:
; measured 8, 16, 24 and 32 workers all land at ~300s, so nothing above 8 buys wall time,
; and the pin is what keeps the surplus out of the app's share.
addopts = -p no:asyncio --dist=loadscope -n 8
markers =
    quarantine: known-flaky, skipped unless --run-quarantined (see FLAKY_TESTS.md)
